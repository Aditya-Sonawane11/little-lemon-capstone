services:
  db:
    image: mysql:8.4
    container_name: little-lemon-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: littlelemon
      MYSQL_USER: littlelemon
      MYSQL_PASSWORD: littlelemon
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - little_lemon_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  little_lemon_mysql:
